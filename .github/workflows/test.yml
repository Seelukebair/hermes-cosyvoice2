name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=runtime python -m unittest discover -s runtime/tests -v
      - run: python -m unittest discover -s integrations/home-assistant/tests -v
      - run: python -m compileall -q __init__.py voice_manager.py runtime scripts integrations/home-assistant
      - run: bash -n scripts/stage-runtime.sh
